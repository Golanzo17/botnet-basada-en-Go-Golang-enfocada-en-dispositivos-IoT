# ============================================================================
# docker-compose.yml: Orquestación Segura del Banco de Pruebas IoT
# ============================================================================
services:
  servidor_mock:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: servidor_mock
    networks:
      - red_simulacion
    ports:
      - "9090:9090"
    tty: true
    stdin_open: true

  cliente_c:
    build:
      context: ./Codigo_c/Arquitectura_AMD64
      dockerfile: Dockerfile
    container_name: cliente_c_amd64
    networks:
      - red_simulacion
    depends_on:
      - servidor_mock
    mem_limit: 32m
    memswap_limit: 32m
    tty: true
    stdin_open: true
    command: ["5", "2", "64", "servidor_mock"]

networks:
  red_simulacion:
    driver: bridge

